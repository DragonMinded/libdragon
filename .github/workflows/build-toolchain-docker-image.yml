name: build-toolchain-docker-image
# This workflow builds and pushes Docker images for multiple platforms.
# When running on a fork, it will push the image to the fork's registry, although you may need to allow it.

on:
  push:
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-toolchain-docker-image.yml'
      - 'tools/build-toolchain.sh'
      - 'tools/build-gdb.sh'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-toolchain-docker-image.yml'
      - 'tools/build-toolchain.sh'
      - 'tools/build-gdb.sh'

env:
  REGISTRY: ghcr.io
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1


# Make sure we don't have more than one active workflow to prevent race conditions
# e.g a previous toolchain build may tag and push `latest` later if we don't have
# this. It is ok to have parallel runs for push and PR events and from different
# branches. We can cancel previous runs for non-trunk events.
concurrency:
  group: build-multiplatform-docker-image-${{ github.ref }}-${{ github.event_name }}

jobs:

  build-toolchain-docker-image:
    strategy:
      fail-fast: false
      matrix:
        include: [
            { host-os: ubuntu-24.04, platform: linux/amd64 },
            { host-os: ubuntu-24.04-arm, platform: linux/arm64, }
          ]
    runs-on: ${{ matrix.host-os }}

    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Prepare environment variables
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          # Create a lower cased version of the repo name for images
          # as docker supports only lowercase names in the registry.
          echo "GITHUB_REPOSITORY_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GITHUB_REPOSITORY_LC }}

      - name: Login to Docker Package Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_REPOSITORY_LC }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true 

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  generate-multiplatform-image:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    needs:
      - build-toolchain-docker-image

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Prepare environment variables
        run: |
          # Create a lower cased version of the repo name for images
          # as docker supports only lowercase names in the registry.
          echo "GITHUB_REPOSITORY_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Package Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        # This step is needed to create the manifest list and push it to the registry.
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.GITHUB_REPOSITORY_LC }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.GITHUB_REPOSITORY_LC }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.GITHUB_REPOSITORY_LC }}:${{ steps.meta.outputs.version }}

  smoketest-multiplatform-image:
    strategy:
      fail-fast: false
      matrix:
        include: [
            { host-os: ubuntu-24.04 },
            { host-os: ubuntu-24.04-arm }
          ]
    runs-on: ${{ matrix.host-os }}

    permissions:
      contents: read
      packages: read
      attestations: read
      id-token: write
    needs:
      - generate-multiplatform-image

    steps:
      - name: Prepare environment variables
        run: |
          # Create a lower cased version of the repo name for images
          # as docker supports only lowercase names in the registry.
          echo "GITHUB_REPOSITORY_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Using a shallow checkout. Change to `0` if a full fetch is required.

      - name: Login to Docker Package Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.GITHUB_REPOSITORY_LC }}:${{ needs.generate-multiplatform-image.outputs.version }}

      # Verify everything is building properly using the image built in the previous job.
      - name: Build libdragon
        run: |
          docker run \
          --mount type=bind,source=$(pwd),target=/libdragon \
          --workdir=/libdragon \
          ${{ env.REGISTRY }}/${{ env.GITHUB_REPOSITORY_LC }}:${{ needs.generate-multiplatform-image.outputs.version }} \
          ./build.sh

      - name: Upload built ROMs to artifacts generated on ${{ matrix.host-os }}
        uses: actions/upload-artifact@v4
        with:
          name: roms_${{ matrix.host-os }}
          path: |
            ${{ github.workspace }}/examples/**/*.z64
            ${{ github.workspace }}/tests/*.z64
